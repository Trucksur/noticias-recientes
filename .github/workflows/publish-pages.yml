# .github/workflows/publish-pages.yml
#
# Publica el informe diario en la rama gh-pages (de la que sirve GitHub Pages)
# con scripts/publicar_edicion.py:
#
# - Push de la rutina a una rama claude/*: archiva la edición en AAAA/MM/DD/,
#   actualiza la portada, ediciones.json y el menú lateral, y elimina la rama
#   claude/* para que no se acumulen.
# - Push a main que toca el menú o el script, o lanzamiento manual: redespliega
#   el menú y regenera el archivo sin publicar ninguna edición nueva.
#
# En todos los casos se archivan los días del historial de gh-pages que aún no
# estén en el archivo (nunca se sobrescribe un día ya archivado).

name: Publicar en GitHub Pages

on:
  push:
    branches:
      - "claude/**"
      - main
    paths:
      - "index.html"
      - "sitio/**"
      - "scripts/publicar_edicion.py"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RAMA: ${{ github.ref_name }}
      ES_EDICION: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'claude/') }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar la copia de gh-pages
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add -B gh-pages "$RUNNER_TEMP/gh-pages" origin/gh-pages
          else
            git worktree add --orphan -b gh-pages "$RUNNER_TEMP/gh-pages"
          fi

      - name: Archivar y regenerar el sitio
        id: publicar
        run: |
          set -euo pipefail
          args=(--sitio "$RUNNER_TEMP/gh-pages" --assets sitio)
          if git rev-parse --verify --quiet origin/gh-pages >/dev/null; then
            args+=(--recuperar-historial origin/gh-pages)
          fi
          if [[ "$ES_EDICION" == "true" ]]; then
            args+=(--edicion index.html)
          fi
          python3 scripts/publicar_edicion.py "${args[@]}"

      - name: Subir a gh-pages
        env:
          FECHA: ${{ steps.publicar.outputs.fecha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gh-pages"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios; nada que publicar."
            exit 0
          fi
          if [[ "$ES_EDICION" == "true" ]]; then
            mensaje="Publicar edición ${FECHA:-sin fecha} desde $RAMA"
          else
            mensaje="Actualizar archivo y menú desde $RAMA"
          fi
          git commit -m "$mensaje"
          git push origin gh-pages

      - name: Eliminar la rama de la rutina
        if: env.ES_EDICION == 'true'
        run: git push origin --delete "$RAMA"
