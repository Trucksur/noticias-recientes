# .github/workflows/publish-pages.yml
#
# Cada vez que una rutina de Claude hace push a una rama claude/*,
# publica index.html en la rama gh-pages (de la que sirve GitHub Pages)
# y elimina la rama claude/* para que no se acumulen.

name: Publicar en GitHub Pages

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "index.html"

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama de la rutina
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar index.html a gh-pages
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp index.html /tmp/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf --quiet . || true
          fi
          cp /tmp/index.html index.html
          touch .nojekyll
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "Sin cambios en index.html; nada que publicar."
          else
            git commit -m "Publicar informe desde $SOURCE_BRANCH"
            git push origin gh-pages
          fi

      - name: Eliminar la rama de la rutina
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: git push origin --delete "$SOURCE_BRANCH"
